name: hotgo-kafka-tls

services:
  kafka:
    image: bitnamilegacy/kafka:3.5.2-debian-12-r30
    container_name: hotgo-kafka-tls
    restart: always
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: "HotKafkaTls35LocalAAAA"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LISTENERS: "SSL://:9092,CONTROLLER://:9093,EXTERNAL://:19097"
      KAFKA_CFG_ADVERTISED_LISTENERS: "SSL://kafka:9092,EXTERNAL://localhost:19097"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "SSL:SSL,CONTROLLER:PLAINTEXT,EXTERNAL:SSL"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "SSL"
      KAFKA_CFG_SSL_KEYSTORE_LOCATION: "/opt/bitnami/kafka/config/certs/server.keystore.p12"
      KAFKA_CFG_SSL_KEYSTORE_PASSWORD: "changeit"
      KAFKA_CFG_SSL_KEYSTORE_TYPE: "PKCS12"
      KAFKA_CFG_SSL_TRUSTSTORE_LOCATION: "/opt/bitnami/kafka/config/certs/server.truststore.p12"
      KAFKA_CFG_SSL_TRUSTSTORE_PASSWORD: "changeit"
      KAFKA_CFG_SSL_TRUSTSTORE_TYPE: "PKCS12"
      KAFKA_CFG_SSL_CLIENT_AUTH: "none"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      TZ: Asia/Shanghai
    ports:
      - "19097:19097"
    volumes:
      - ./data:/bitnami/kafka
      - ../certs:/opt/bitnami/kafka/config/certs:ro
      - ./client.properties:/opt/bitnami/kafka/config/client.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/bitnami/kafka/config/certs/server.keystore.p12 && kafka-topics.sh --bootstrap-server localhost:9092 --command-config /opt/bitnami/kafka/config/client.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
